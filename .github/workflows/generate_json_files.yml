name: Update sitemap and jsonlds

on:
  push:
    branches: [ master ]
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'

jobs:
  update-sitemap-and-jsonlds:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: master  # Check out the `yl_dv` branch

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --locked --no-dev

    - name: Clean up the target folder (if exists)
      run: |
        if [ -d "data/output" ]; then
          rm -rf data/output/*
        else
          mkdir -p data/output
        fi
    - name: Clean up the target folder (if exists)
      run: |
        if [ -d "data/validation_reports" ]; then
          rm -rf data/validation_reports/*
        else
          mkdir -p data/validation_reports
        fi
    - name: Run main.py with configfile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
         uv run --no-dev main.py --branch data --configfile https://raw.githubusercontent.com/eco4cast/challenge-catalogs/main/catalog.json
         uv run --no-dev main.py --validate --configfile https://raw.githubusercontent.com/eco4cast/challenge-catalogs/main/catalog.json
        # uv run --no-dev main.py --configfile ./data/challenge/catalog-yl.json

    - name: Stage changes in the data folder
      run: |
        git add data  # Stage only the `data` folder
        #git add validation_reports  # Stage only the `validation_reports` folder

    - name: Commit and push changes if any
      run: |
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated commit: Update data folder"
          # force push: `data` is a regenerated snapshot of the output,
          # not a branch with history worth preserving
          git push --force origin HEAD:data
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
